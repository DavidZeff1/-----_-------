        - generic [ref=f1e429]: "חישוב ROI על תקן עו\"ס הוא תרגיל לגיטימי. אבל נקודת ההשוואה הנכונה אינה \"כמה שעות עבודה מקבלת המועצה\" — אלא \"כמה היה עולה למועצה אירוע אחד של רצח על רקע אלמ\"ב\": תביעת נזיקין; ועדת חקירה; פגיעה במוניטין של הרשות בקרב יישובים שכבר עומדים בנטל יוצא דופן; השלכות תקציביות על משפחות הנפגעות שיהפכו לקבוצת תמיכה ממושכת באגף. אירוע אחד שווה עשרות שנות תקן."
