      - heading "סיכום ניהולי — ארבע שורות" [level=2] [ref=f1e38]
      - list [ref=f1e39]:
        - listitem [ref=f1e40]:
          - text: ביחידת אלמ"ב של המועצה לא הוזרמה אף פנייה חדשה דרך המוקד
          - strong [ref=f1e41]: בארבעת החודשים האחרונים
          - text: (פברואר–מאי 2026), זאת לעומת ממוצע של כ-2 פניות/חודש בחצי השני של 2025 ובינואר 2026. ביתר היחידות באגף יש פעילות שוטפת מלאה באותה תקופה.
        - listitem [ref=f1e42]:
          - text: המועצה היא רשות
          - strong [ref=f1e43]: עתירת ילדים באופן חריג
          - text: ": 44.3% מתחת לגיל 18 (לעומת 32.3% ארצית); 5.1% משפחות עם 4+ ילדים (לעומת 2.3% ארצית, פי 2.2). זו דווקא הדמוגרפיה שדורשת חיזוק מענה אלמ\"ב, לא צמצומו."
        - listitem [ref=f1e44]:
          - text: כל המועצות האזוריות הסמוכות (מטה בנימין, מטה יהודה, שומרון, חבל מודיעין, זבולון, שדות נגב, עמק יזרעאל)
          - strong [ref=f1e45]: מאיישות יחידת אלמ"ב פעילה
          - text: ". גם המועצה רשומה במשרד הרווחה כמפעילת מרכז – אך בפועל אינה נותנת שירות. זו חשיפה כפולה: משפטית מול תושבות, ורגולטורית מול משרד הרווחה."
        - listitem [ref=f1e46]:
          - text: "הטיעון של \"ירידה בתיקי משטרה\" אינו ראיה לירידה בתופעה: מחקר ברוקדייל (מדגם מייצג n=1,500) מצא ש-"
          - strong [ref=f1e47]: 69.3% ממי שחוו אלימות במלחמה לא פנו לעזרה כלל
          - text: . תיקים יורדים דווקא כשהשירותים בקהילה מתפרקים. המדד הזה הוא בדיוק האזהרה, לא ההפרכה.
      - heading "1. ראיות פנימיות – קובץ המוקד" [level=2] [ref=f1e48]
      - generic [ref=f1e49]:
