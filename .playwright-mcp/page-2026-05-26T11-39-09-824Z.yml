        - generic [ref=f1e52]:
          - text: "בחודשים יוני–דצמבר 2025 הוזרמו בממוצע כ-2 פניות/חודש ליחידה. ינואר 2026: פנייה אחת בלבד (האחרונה: 27/01/2026). מפברואר ועד תאריך עריכת הקובץ – אפס פניות. במקביל, ביתר היחידות באגף הוזרמו 56 פניות באפריל ו-30 פניות במחצית הראשונה של מאי 2026."
          - strong [ref=f1e53]: הירידה לאפס מוגבלת ליחידת אלמ"ב בלבד.
          - paragraph [ref=f1e54]: בקובץ הפניות קיימת גם פנייה מינואר 2026 שבה הפונה מתועדת אומרת מילולית שהעו"ס הקודמת "כבר לא בתפקיד" — תיעוד פנימי שמאשר את הוואקום.
